[package]
name = "zelda-notes"
version = "0.2.0"
description = "Zelda Notes desktop app & overlay"
authors = ["Diefrttt"]
edition = "2021"

[lib]
name = "zelda_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
